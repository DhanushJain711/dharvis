name: Build and deploy Python app to Azure Web App - kalendra-bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip . \
            -x "*.git*" \
            -x "*.venv/*" \
            -x "**/__pycache__/*" \
            -x "*.pyc" \
            -x ".env" \
            -x "data/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kalendra-bot'
          slot-name: 'production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_80c7a755812445d69ea5752741270a51 }}
          package: release.zip
